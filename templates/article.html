<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Step by Step Development</title>
<style>
  :root {
    --bg: #faf9f6; --text: #1a1a1a; --muted: #6b6b6b;
    --accent: #2563eb; --border: #e0e0e0;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); line-height: 1.7; font-size: 17px;
    max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem;
  }
  nav { margin-bottom: 2rem; font-size: 0.9rem; }
  nav a { color: var(--muted); }
  h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 0.5rem; }
  h2 { font-size: 1.5rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 0.8rem; }
  h3 { font-size: 1.2rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; }
  p { margin-bottom: 1.2rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  blockquote {
    border-left: 3px solid var(--accent); padding-left: 1.2rem;
    margin: 1.5rem 0; color: var(--muted); font-style: italic;
  }
  pre {
    background: #f0f0f0; padding: 1rem; border-radius: 4px;
    overflow-x: auto; font-family: var(--mono); font-size: 0.85rem;
    margin: 1.5rem 0;
  }
  code { font-family: var(--mono); font-size: 0.85rem; background: #f0f0f0; padding: 0.1rem 0.3rem; border-radius: 2px; }
  pre code { background: none; padding: 0; }
  .meta { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); margin-bottom: 2rem; }
  article { margin-bottom: 3rem; }
  article footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--muted); }
</style>
</head>
<body>
<nav><a href="/">← Step by Step Development</a></nav>
<article>
<header>
  <h1>{{TITLE}}</h1>
  <div class="meta">{{DATE}} · {{READ_TIME}} min read · {{TAGS}}</div>
</header>
{{BODY}}
<footer>
  <p>Evidence-driven growth. No fluff.</p>
</footer>
</article>
</body>
</html>
