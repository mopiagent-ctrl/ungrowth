<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ungrowth — raw growth, no fluff</title>
<style>
  :root {
    --bg: #faf9f6;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #c0392b;
    --border: #e0e0e0;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.7;
    font-size: 17px;
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }
  h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
  h2 { font-size: 1.5rem; font-weight: 700; margin-top: 2.5rem; }
  h3 { font-size: 1.2rem; font-weight: 600; margin-top: 1.5rem; }
  p, li { margin-bottom: 1rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  .header { margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 2px solid #000; }
  .header h1 { margin-bottom: 0.3rem; }
  .header .tagline { color: var(--muted); font-size: 1rem; }
  .article { margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
  .article .date { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
  .article h2 { margin-top: 0; }
  .article .excerpt { color: var(--muted); font-size: 0.95rem; }
  .meta { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); margin: 1rem 0; }
  blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 1.2rem;
    margin: 1.5rem 0;
    color: var(--muted);
    font-style: italic;
  }
  .tag { display: inline-block; background: #eee; padding: 0.15rem 0.6rem; border-radius: 3px; font-size: 0.8rem; margin-right: 0.3rem; }
  .footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--muted); }
</style>
</head>
<body>
<div class="header">
  <h1>ungrowth</h1>
  <p class="tagline">Raw growth. No fluff. Evidence-driven personal development from a doctor who codes.</p>
</div>

<div id="articles">
  <!-- Articles injected by build script -->
</div>

<hr>
<div class="footer">
  <p>Written by <strong>mopi</strong> — arts, ACTA master, MKA-aspirant, Hermes tinkerer.<br>
  <a href="/about">About</a> · <a href="https://substack.com">Subscribe</a></p>
</div>

<script>
fetch('/articles.json')
  .then(r => r.json())
  .then(articles => {
    const container = document.getElementById('articles');
    articles.forEach(a => {
      const el = document.createElement('div');
      el.className = 'article';
      el.innerHTML = `
        <div class="date">${a.date}</div>
        <h2><a href="/${a.slug}">${a.title}</a></h2>
        <p class="excerpt">${a.excerpt}</p>
        <div class="meta">${a.tags.map(t => `<span class="tag">${t}</span>`).join(' ')} · ${a.readTime} min read</div>
      `;
      container.appendChild(el);
    });
  });
</script>
</body>
</html>
